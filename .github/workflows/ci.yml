# CI
#   quality    : golden snapshots, invariants, determinism, case.json round-trip (seconds, no OpenFOAM)
#   foamstudio : shell on Windows, macOS, and Linux. Node 20 writes cases. No OpenFOAM. No WebEngine.
#   generator  : Linux xvfb hosts Qt WebEngine and checks 25 solvers against tests/golden.
#   runtime    : Linux install of ESI OpenFOAM 2412, then simpleFoam -help.
#   openfoam   : generate every solver case headless and run it in a real OpenFOAM install
# The openfoam job mirrors the local WSL procedure (Ubuntu 24.04 + official apt repos).
name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/check.js

  openfoam:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ['2412', '12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ESI OpenFOAM v2412 (test meshes are built with it)
        run: |
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -qq openfoam2412-default
      - name: Install Foundation OpenFOAM
        if: matrix.version != '2412'
        run: |
          sudo sh -c "wget -O - https://dl.openfoam.org/gpg.key > /etc/apt/trusted.gpg.d/openfoam.asc"
          sudo add-apt-repository -y http://dl.openfoam.org/ubuntu
          sudo apt-get update -qq
          sudo apt-get install -y -qq openfoam${{ matrix.version }}
      - name: Generate cases (headless)
        run: node tests/gen.js --vers ${{ matrix.version }} gen_fn.js extra_fn.js
      - name: Build test meshes
        run: bash tests/mkmesh.sh
      - name: Run cases
        run: |
          bash tests/runtests.sh "." | tee results.txt
          bash tests/verify_extra.sh | tee verify.txt
          ! grep -q "^FAIL" results.txt
          ! grep -q "^BAD" verify.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.version }}
          path: |
            results.txt
            verify.txt

  foamstudio:
    # Phase 5 CLI path is `foamstudio --matrix --runtime runtime.json --project DIR`
    # (queues ./Allrun). This job does not install OpenFOAM. The openfoam job runs tests/runtests.sh.
    name: foamstudio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Qt libraries (Linux offscreen)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libfontconfig1 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxi6 libxtst6 libglib2.0-0t64
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: |
          python -m ruff check foamstudio tests scripts
          python -m ruff format --check foamstudio tests scripts
      - name: Mypy
        run: python -m mypy
      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
          FOAMSTUDIO_HEADLESS: "1"
        run: python -m pytest --cov --cov-report=term
      - name: Launch offscreen
        env:
          QT_QPA_PLATFORM: offscreen
          FOAMSTUDIO_HEADLESS: "1"
        run: python -m foamstudio --self-test
      - name: Licence audit
        run: python scripts/license_audit.py --check --write THIRD_PARTY_LICENSES.txt
      - name: Dependency CVE audit
        run: python -m pip_audit --skip-editable --progress-spinner off
      - name: SBOM (CycloneDX)
        if: runner.os == 'Linux'
        run: python -m cyclonedx_py environment --of JSON -o sbom.cdx.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: sbom
          path: |
            sbom.cdx.json
            THIRD_PARTY_LICENSES.txt

  runtime:
    name: runtime (linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt libraries (Linux offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libfontconfig1 libnss3 libxcomposite1 \
            libxdamage1 libxrandr2 libxi6 libxtst6 libglib2.0-0t64
      - name: Install ESI OpenFOAM v2412
        run: |
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -qq openfoam2412-default
      - name: Install FoamStudio
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: Detect and run simpleFoam -help
        env:
          QT_QPA_PLATFORM: offscreen
          FOAMSTUDIO_HEADLESS: "1"
          FOAMSTUDIO_RUNTIME_INTEGRATION: "1"
        run: python -m pytest tests/test_runtime_integration.py

  generator:
    name: generator (linux webengine)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Qt WebEngine libraries and xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            libnss3 libnspr4 libgbm1 libxss1 libasound2t64 libxshmfence1 \
            libxcomposite1 libxdamage1 libxrandr2 libxi6 libxtst6 \
            libxkbcommon0 libxkbcommon-x11-0 libegl1 libgl1 libfontconfig1 \
            libglib2.0-0t64 libxfixes3 libdrm2 libdbus-1-3 libx11-xcb1 \
            libxcb-glx0 libxcb-shape0 libxcb-xfixes0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 fonts-liberation libcups2
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - name: WebEngine bridge byte-identity
        env:
          FOAMSTUDIO_WEBENGINE: "1"
          FOAMSTUDIO_HEADLESS: "1"
          QTWEBENGINE_DISABLE_SANDBOX: "1"
          QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
        run: xvfb-run -a python -m pytest tests/test_generator_bridge.py
