# Nightly validation: rerun the cavity and backward-facing step through FoamStudio on a
# native ESI OpenFOAM v2412 and compare with samples/*/reference.json (scripts/validate.py).
name: validate

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ESI OpenFOAM v2412
        run: |
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          sudo apt-get install -y -qq openfoam2412-default
      - name: Install FoamStudio
        run: |
          python -m pip install -U pip
          python -m pip install -e .
      - name: Pick the ESI 2412 runtime
        run: |
          python -m foamstudio --detect-runtimes > detected.json
          python -c "import json; r=[i for i in json.load(open('detected.json')) if i['flavour']=='esi' and i['version']=='2412']; json.dump(r[0], open('runtime.json','w'))"
          cat runtime.json
      - name: Validate
        run: python scripts/validate.py --runtime runtime.json --work work | tee validation.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation
          path: |
            validation.md
            work/validation.json
            work/*/case/log.*
