<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FoamStudio dashboard</title>
<style>
  :root {
    --bg: #0f1218; --panel: #171b23; --line: #262c38; --text: #e6e9ef; --muted: #8a93a6;
    --accent: #4fb3ff; --ok: #3ecf8e; --bad: #ff6b6b; --warn: #f5b342;
    --c0: #4fb3ff; --c1: #ff9f43; --c2: #3ecf8e; --c3: #c084fc; --c4: #f472b6; --c5: #facc15;
  }
  body.light {
    --bg: #f4f6fa; --panel: #ffffff; --line: #dde2ea; --text: #1b2230; --muted: #5d6779;
    --accent: #0a74d6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .path { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { padding: 2px 10px; border-radius: 99px; font-size: 12px; border: 1px solid var(--line); }
  .pill.run { color: var(--ok); border-color: var(--ok); }
  .pill.idle { color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
  }
  .card .k { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .card .v { font-size: 20px; font-weight: 600; margin-top: 2px; }
  .card .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .row { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-top: 10px; }
  @media (max-width: 900px) { .row { grid-template-columns: 1fr; } }
  h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
  canvas { width: 100%; height: 240px; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; color: var(--muted); font-size: 12px; }
  .legend i { display: inline-block; width: 10px; height: 3px; margin-right: 4px; vertical-align: middle; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 12px; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 8px; width: 90px; font: inherit; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #progress { color: var(--muted); margin-left: auto; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<header>
  <h1 id="title">FoamStudio</h1>
  <span class="pill idle" id="status">idle</span>
  <span class="path" id="path">No project open</span>
</header>

<section class="grid">
  <div class="card"><div class="k">Mesh</div><div class="v" id="cells">–</div><div class="s" id="mem"></div></div>
  <div class="card"><div class="k">Runtime</div><div class="v" id="runtime">–</div><div class="s" id="cores"></div></div>
  <div class="card"><div class="k">Latest</div><div class="v" id="latest">–</div><div class="s" id="rate"></div></div>
  <div class="card"><div class="k">Forces</div><div class="v" id="forces">–</div><div class="s" id="forcesSub"></div></div>
  <div class="card"><div class="k">Licence</div><div class="v" id="licence" style="font-size:14px">–</div><div class="s" id="wsl"></div></div>
</section>

<section class="card" style="margin-top:10px">
  <div class="controls">
    <button class="primary" onclick="act('run')">▶ Run</button>
    <button class="danger" onclick="act('stop')">■ Stop</button>
    <button onclick="act('continue', val('endTime'))">⟳ Continue</button>
    <label>End time <input id="endTime" placeholder="keep"></label>
    <label>Processes <input id="procs" type="number" min="1" max="256" onchange="act('processes', this.value)"></label>
    <label><input type="checkbox" id="bg" style="width:auto" onchange="act('detached', this.checked ? '1' : '')"> keep running after close</label>
    <span id="progress"></span>
  </div>
</section>

<section class="row">
  <div class="card">
    <h2>Residuals (initial, log scale)</h2>
    <canvas id="res"></canvas><div class="legend" id="resLegend"></div>
  </div>
  <div class="card">
    <h2>Quick actions</h2>
    <div class="actions">
      <button onclick="act('new')">New project</button>
      <button onclick="act('open')">Open project</button>
      <button onclick="act('airfoil')">New airfoil case</button>
      <button onclick="act('demo')">Run demo</button>
      <button onclick="act('setup')">Case setup</button>
      <button onclick="act('tools')">Workspace tools</button>
      <button onclick="act('mesh')">View mesh (3D)</button>
      <button onclick="act('field', 'p')">Colour by p (3D)</button>
      <button onclick="act('quality')">Worst cells (3D)</button>
      <button onclick="act('report')">HTML report</button>
    </div>
  </div>
</section>

<section class="row">
  <div class="card">
    <h2>Force coefficients</h2>
    <canvas id="coef"></canvas><div class="legend" id="coefLegend"></div>
  </div>
  <div class="card">
    <h2>Run history</h2>
    <table><thead><tr><th>Started</th><th>Run</th><th>Status</th><th>s</th></tr></thead>
      <tbody id="history"></tbody></table>
  </div>
</section>

<script>
  "use strict";
  let py = null;
  const $ = id => document.getElementById(id);
  const val = id => $(id).value.trim();
  const css = name => getComputedStyle(document.body).getPropertyValue(name).trim();
  const colours = () => [0, 1, 2, 3, 4, 5].map(i => css("--c" + i));
  function act(name, arg) { if (py) py.action(name, arg == null ? "" : String(arg)); }

  // Minimal line chart on a canvas: series = {name: [[x, y], ...]}
  function chart(canvas, series, legend, logY) {
    const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    const g = canvas.getContext("2d"); g.scale(dpr, dpr); g.clearRect(0, 0, w, h);
    const names = Object.keys(series).filter(n => series[n].length);
    legend.innerHTML = "";
    if (!names.length) {
      g.fillStyle = css("--muted"); g.font = "13px Segoe UI"; g.textAlign = "center";
      g.fillText("No data yet. Run the case.", w / 2, h / 2); return;
    }
    const f = y => logY ? Math.log10(Math.max(y, 1e-16)) : y;
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    names.forEach(n => series[n].forEach(([x, y]) => {
      x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, f(y)); y1 = Math.max(y1, f(y));
    }));
    if (logY) { y0 = Math.floor(y0); y1 = Math.ceil(y1); }
    if (y1 === y0) { y1 += 1; y0 -= 1; } if (x1 === x0) x1 = x0 + 1;
    const L = 52, R = 10, T = 8, B = 22;
    const X = x => L + (x - x0) / (x1 - x0) * (w - L - R);
    const Y = y => T + (1 - (f(y) - y0) / (y1 - y0)) * (h - T - B);
    g.strokeStyle = css("--line"); g.fillStyle = css("--muted"); g.font = "11px Segoe UI"; g.lineWidth = 1;
    const ticks = logY ? Math.min(y1 - y0, 8) : 4;
    for (let i = 0; i <= ticks; i++) {
      const v = y0 + (y1 - y0) * i / ticks, py_ = T + (1 - i / ticks) * (h - T - B);
      g.beginPath(); g.moveTo(L, py_); g.lineTo(w - R, py_); g.stroke();
      g.textAlign = "right"; g.fillText(logY ? "1e" + Math.round(v) : v.toPrecision(3), L - 6, py_ + 4);
    }
    g.textAlign = "center"; g.fillText(x0.toPrecision(4), L, h - 6); g.fillText(x1.toPrecision(4), w - R, h - 6);
    const cs = colours();
    names.forEach((n, i) => {
      g.strokeStyle = cs[i % cs.length]; g.lineWidth = 1.6; g.beginPath();
      series[n].forEach(([x, y], j) => j ? g.lineTo(X(x), Y(y)) : g.moveTo(X(x), Y(y)));
      g.stroke();
      const last = series[n][series[n].length - 1][1];
      legend.insertAdjacentHTML("beforeend", `<span><i style="background:${cs[i % cs.length]}"></i>${n} ${last.toPrecision(4)}</span>`);
    });
  }

  function render(s) {
    document.body.classList.toggle("light", s.theme === "light");
    $("title").textContent = s.project ? s.project : "FoamStudio";
    $("path").textContent = s.path || "No project open. Start with New project, New airfoil case or Run demo.";
    $("status").textContent = s.running ? "running" : "idle";
    $("status").className = "pill " + (s.running ? "run" : "idle");
    $("cells").textContent = s.cells ? s.cells.toLocaleString() + " cells" : "no mesh";
    $("mem").textContent = s.cells ? `≈ ${s.memory.toFixed(1)} GB · suggest ${s.suggested} procs` : "";
    $("runtime").textContent = s.runtime || "none";
    $("cores").textContent = `${s.cores} physical cores · ${s.ram.toFixed(0)} GB RAM`;
    $("latest").textContent = s.progress ? "t = " + s.progress.t : "–";
    $("rate").textContent = s.progress ? `${s.progress.rate.toPrecision(3)} /s` + (s.progress.eta != null ? ` · ETA ${Math.round(s.progress.eta / 60)} min` : "") : "";
    const cd = s.coefficients.Cd, cl = s.coefficients.Cl;
    $("forces").textContent = cd && cd.length ? `Cd ${cd[cd.length - 1][1].toPrecision(4)}` : "–";
    $("forcesSub").textContent = cl && cl.length ? `Cl ${cl[cl.length - 1][1].toPrecision(4)}` : "no forceCoeffs";
    $("licence").textContent = s.licence;
    $("wsl").textContent = s.wsl;
    $("progress").textContent = Object.entries(s.monitor).map(([k, v]) => `${k} ${(+v).toPrecision(3)}`).join(" · ");
    if (document.activeElement !== $("procs")) $("procs").value = s.processes;
    $("bg").checked = s.detached;
    chart($("res"), s.residuals, $("resLegend"), true);
    chart($("coef"), s.coefficients, $("coefLegend"), false);
    $("history").innerHTML = s.history.length ? s.history.map(h =>
      `<tr><td>${h.started}</td><td>${h.name}</td><td class="${h.status === "succeeded" ? "ok" : "bad"}">${h.status}</td><td>${h.seconds}</td></tr>`
    ).join("") : `<tr><td colspan="4" class="empty">No runs yet</td></tr>`;
  }

  let last = null;
  window.addEventListener("resize", () => last && render(last));
  new QWebChannel(qt.webChannelTransport, ch => {
    py = ch.objects.py;
    py.updated.connect(text => { last = JSON.parse(text); render(last); });
    py.state(text => { last = JSON.parse(text); render(last); });
  });
</script>
</body>
</html>
