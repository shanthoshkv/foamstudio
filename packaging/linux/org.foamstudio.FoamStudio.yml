# Flatpak manifest. Not built and not submitted to Flathub.
app-id: org.foamstudio.FoamStudio
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
command: foamstudio
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=home
modules:
  - name: foamstudio
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app .
      - install -Dm644 LICENSE /app/share/licenses/foamstudio/LICENSE
    sources:
      - type: dir
        path: ../..
